[project]
name = "fichadopolitico"
version = "0.1.0"
description = "Ficha pública e apartidária de parlamentares brasileiros"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line-length (já gerenciado pelo formatador)
]

[tool.ruff.lint.isort]
known-first-party = ["scripts"]
