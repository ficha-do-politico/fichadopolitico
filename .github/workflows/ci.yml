name: CI - Integridade e Build

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Setup Python
        run: uv python install 3.12

      - name: Lint and formatting check (Ruff)
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Compile site data
        run: uv run python scripts/build_site_data.py

      - name: Verify data drift
        run: git diff --exit-code dados/camara/deputados.json dados/senado/senadores.json site/src/data/

      - name: Run data integrity & pipeline tests
        run: uv run python -m unittest discover tests

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        run: npm --prefix site ci

      - name: Typecheck Astro site
        run: npm --prefix site run check

      - name: Build Astro site
        run: npm --prefix site run build
        env:
          ASTRO_SITE: "https://ficha-do-politico.github.io"
          ASTRO_BASE: "/"
